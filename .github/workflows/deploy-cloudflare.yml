name: Deploy to Cloudflare

# Deploys the app to Cloudflare Containers, then runs the browser smoke test against the live URL.
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token that can edit Workers and Containers
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   TRUEEDIT_PASSWORD      password for the site (the browser asks once; any username)
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-hopper-hzl8uf]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_PASSWORD: ${{ secrets.TRUEEDIT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=0
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Repository secret $s is not set"; missing=1; fi
          done
          if [ "$HAS_PASSWORD" != "true" ]; then echo "::error::Repository secret TRUEEDIT_PASSWORD is not set (the site would be open to anyone)"; missing=1; fi
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm ci

      - name: Deploy (builds the Docker image and pushes it to Cloudflare)
        id: deploy
        working-directory: cloudflare
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Could not find the workers.dev URL in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Set site password
        working-directory: cloudflare
        env:
          PW: ${{ secrets.TRUEEDIT_PASSWORD }}
        run: printf '%s' "$PW" | npx wrangler secret put TRUEEDIT_PASSWORD

      - name: Wait for the container to start
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "$url/api/health" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$url/api/health never returned 200"; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/pip install -q --no-deps -r requirements-models.txt
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Smoke test the live site
        env:
          TRUEEDIT_PASSWORD: ${{ secrets.TRUEEDIT_PASSWORD }}
        run: |
          set -o pipefail
          .venv/bin/python scripts/smoke_test.py "${{ steps.deploy.outputs.url }}" samples/order_photo.jpg | tee smoke.log
          { echo '```'; cat smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
